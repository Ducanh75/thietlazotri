<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - Đức Anh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0052d4, #4364f7);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bio-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            display: block;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease;
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05) rotate(3deg);
        }
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            display: block;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease;
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05) rotate(3deg);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .bio-description {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #e0e7ff;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            list-style: none;
        }

        .link-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .link-item i {
            font-size: 1.3rem;
        }

        .link-item:hover {
            background: #ffffff;
            color: #0052d4;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4);
        }


        .link-item.github:hover { color: #333; }
 
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            opacity: 0.8;
            color: #cbd5e1;
        }

    </style>
</head>
<body>

    <div class="bio-container">
     
        <div class="avatar-wrapper">
            <img src="retouch_2025120622534810.jpg" alt="Avatar Đức Anh" class="avatar">
        </div>
        
        <h1>Đức Anh</h1>
        <p class="bio-description">Chào mừng bạn đến với trang cá nhân của tôi!</p>

        <ul class="links-list">  <li>
                <a href="https://linkbio.co/6101308uWNN4S" class="link-item github" target="_blank">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub Portfolio</span>
                </a>
            </li>
           
        </ul>
    
        <div class="card">
            <h2>Liên Hệ</h2>
            <p>📧 Email: dinhducanh07052011@gmail.com</p>
           
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Đức Anh. Bản quyền được bảo lưu.</p>
    </footer>

</body>
</html>
